<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create an account - Tech Blog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main>
        <div class="mx-auto flex max-w-md flex-col px-4 py-16 sm:px-6">
            <h1 class="text-3xl font-bold text-foreground">Create an account</h1>
            <p class="mt-2 text-sm text-muted-foreground">Join TechPulse to save articles, comment, and more.</p>

            <div th:if="${error}" style="color: var(--destructive); margin-top: 1rem; font-size: 0.875rem;" th:text="${error}"></div>

            <form class="mt-8 space-y-4" th:action="@{/register}" th:object="${registerRequest}" method="post">
                <div class="space-y-2">
                    <label for="username" class="label">Username</label>
                    <input id="username" th:field="*{username}" class="input" placeholder="Enter your username">
                    <div style="color: var(--destructive); font-size: 0.75rem;" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>
                <div class="space-y-2">
                    <label for="email" class="label">Email</label>
                    <input id="email" type="email" th:field="*{email}" class="input" placeholder="you@example.com">
                    <div style="color: var(--destructive); font-size: 0.75rem;" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="space-y-2">
                    <label for="password" class="label">Password</label>
                    <input id="password" type="password" th:field="*{password}" class="input" placeholder="••••••••">
                    <div style="color: var(--destructive); font-size: 0.75rem;" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="space-y-2">
                    <label for="confirmPassword" class="label">Confirm Password</label>
                    <input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="input" placeholder="••••••••">
                    <div style="color: var(--destructive); font-size: 0.75rem;" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>
                <button type="submit" class="btn btn-primary w-full btn-lg">Create account</button>
            </form>

            <p class="mt-6 text-center text-sm text-muted-foreground">
                Already have an account? <a th:href="@{/login}" class="font-medium text-primary hover:underline" style="text-decoration: underline;">Sign in</a>
            </p>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
