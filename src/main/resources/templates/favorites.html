<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện Yêu Thích | TechPulse</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .favorites-header {
            text-align: center;
            padding: 4rem 0 2rem 0;
            background-color: #fce7f3;
            border-radius: 12px;
            margin-bottom: 3rem;
        }
        .favorites-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #be185d;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main class="container py-8" style="min-height: 60vh;">
        <div class="favorites-header">
            <h1>❤️ Tủ Bài Viết Yêu Thích Của Bạn</h1>
            <p class="text-muted mt-2">Nơi lưu giữ những tinh hoa công nghệ mà bạn đã thả tim.</p>
        </div>

        <div th:if="${likedPosts == null || likedPosts.isEmpty()}" style="text-align: center; padding: 4rem 0;">
            <div style="font-size: 4rem; opacity: 0.5;">📭</div>
            <h3 class="text-2xl font-bold mt-4">Trống trơn!</h3>
            <p class="text-muted mt-2">Bạn chưa thả tim cho bài viết nào. Hãy ra ngoài trang chủ và đọc thử các chủ đề xem sao nhé.</p>
            <a th:href="@{/}" class="btn btn-primary mt-4">Quay lại Trang chủ</a>
        </div>

        <div class="grid grid-3 gap-6" th:if="${likedPosts != null && !likedPosts.isEmpty()}">
            <article class="post-card" th:each="post : ${likedPosts}">
                <a th:href="@{/post/{slug}(slug=${post.slug})}" class="post-card-img" th:text="${post.category != null ? post.category.name : 'Blog'}">Category</a>
                <div class="post-card-body">
                    <div>
                        <div class="post-card-meta"><span class="badge badge-secondary" th:text="${post.category != null ? post.category.name : 'Tech'}"></span><span
                                class="text-xs text-muted" th:text="${#temporals.format(post.createdAt, 'dd/MM/yyyy')}">Date</span></div>
                        <a th:href="@{/post/{slug}(slug=${post.slug})}">
                            <h3 th:text="${post.title}">Title</h3>
                        </a>
                        <p class="text-sm text-muted mt-2 line-clamp-2" th:text="${post.summary}">Summary</p>
                    </div>
                </div>
            </article>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
