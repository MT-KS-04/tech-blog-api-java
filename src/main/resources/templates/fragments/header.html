<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <header class="header" th:fragment="header">
        <div class="container header-inner" style="display: flex; align-items: center; justify-content: space-between;">
            <a th:href="@{/}" class="logo">Tech<span>Pulse</span></a>

            <nav class="nav-links mobile-hidden" style="display: flex; gap: 20px; margin-left: 50px;">
                <a th:href="@{/}" style="color:var(--fg); font-weight: 600;">Home</a>
                <a href="#">Articles</a>
                <a href="#">Reviews</a>
                <a href="#">AI &amp; ML</a>
            </nav>

            <form class="search-box mobile-hidden" th:action="@{/search}" method="get" style="position: relative; margin-left: auto; margin-right: 30px;">
                <input type="text" name="q" placeholder="Tìm kiếm bài viết..." class="input" th:value="${param.q != null ? param.q[0] : ''}" style="padding-left: 35px; border-radius: 20px; height: 36px; width: 250px; font-size: 14px; border: 1px solid var(--border);">
                <svg style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted-fg); pointer-events: none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </form>

            <div class="nav-actions mobile-hidden" style="display: flex; align-items: center; gap: 15px;">
                <th:block th:if="${currentUser == null}">
                    <a th:href="@{/login}" class="btn btn-ghost btn-sm">Log in</a>
                    <a th:href="@{/register}" class="btn btn-primary btn-sm">Sign up</a>
                </th:block>

                <div th:if="${currentUser != null}" style="display: flex; align-items: center; gap: 15px;">
                    <span class="text-sm font-medium">Hello, <span th:text="${currentUser}" class="text-primary font-bold"></span>!</span>
                    <form th:action="@{/logout}" method="post" style="margin: 0;" onsubmit="return confirm('Are you sure you want to log out?');">
                        <button type="submit" class="btn btn-sm" style="background-color: var(--destructive, #ef4444); color: white; border: none; padding: 6px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.05);" onmouseover="this.style.backgroundColor='var(--destructive-hover, #dc2626)'" onmouseout="this.style.backgroundColor='var(--destructive, #ef4444)'">Log out</button>
                    </form>
                </div>
            </div>

            <button id="mobile-menu-btn" class="btn btn-ghost btn-icon" style="display:none">☰</button>
        </div>
    </header>
</body>
</html>
