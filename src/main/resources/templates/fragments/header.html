<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <header class="header" th:fragment="header">
        <div class="container header-inner" style="display: flex; align-items: center; justify-content: space-between;">
            <a th:href="@{/}" class="logo">Tech<span>Pulse</span></a>

            <nav class="nav-links mobile-hidden" style="display: flex; gap: 20px; margin-left: 50px;">
                <a th:href="@{/}" style="color:var(--fg); font-weight: 600;">Home</a>
                <a href="#">Articles</a>
                <a href="#">Reviews</a>
                <a href="#">AI &amp; ML</a>
            </nav>

            <form class="search-box mobile-hidden" th:action="@{/search}" method="get" style="position: relative; margin-left: auto; margin-right: 30px;">
                <input type="text" name="q" placeholder="Tìm kiếm bài viết..." class="input" th:value="${param.q != null ? param.q[0] : ''}" style="padding-left: 35px; border-radius: 20px; height: 36px; width: 250px; font-size: 14px; border: 1px solid var(--border);">
                <svg style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted-fg); pointer-events: none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </form>

            <div class="nav-actions mobile-hidden" style="display: flex; align-items: center; gap: 15px;">
                <th:block th:if="${currentUser == null}">
                    <a th:href="@{/login}" class="btn btn-ghost btn-sm">Log in</a>
                    <a th:href="@{/register}" class="btn btn-primary btn-sm">Sign up</a>
                </th:block>

                <div th:if="${currentUser != null}" class="user-menu" role="navigation" aria-label="Tài khoản">
                    <button type="button" class="user-menu-trigger" aria-haspopup="true" id="user-menu-trigger">
                        <span class="user-menu-avatar" aria-hidden="true">
                            <svg class="user-menu-avatar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <span class="user-menu-chevron" aria-hidden="true">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                        </span>
                    </button>
                    <div class="user-menu-dropdown" role="menu" aria-labelledby="user-menu-trigger">
                        <div class="user-menu-dropdown-inner">
                            <p class="user-menu-greeting">
                                <span class="user-menu-greeting-label">Tài khoản</span>
                                <span class="user-menu-greeting-name" th:text="${currentUser}">user</span>
                            </p>
                            <a th:href="@{/profile}" class="user-menu-item" role="menuitem">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                Hồ sơ
                            </a>
                            <form th:action="@{/logout}" method="post" class="user-menu-logout-form" role="none" onsubmit="return confirm('Bạn có chắc muốn đăng xuất?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="user-menu-item user-menu-item-logout" role="menuitem">
                                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                                    Đăng xuất
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <button id="mobile-menu-btn" class="btn btn-ghost btn-icon" style="display:none">☰</button>
        </div>
    </header>
</body>
</html>
