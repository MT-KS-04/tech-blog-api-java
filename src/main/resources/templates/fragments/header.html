<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <header class="header" th:fragment="header">
        <div class="container header-inner" style="display: flex; align-items: center; justify-content: space-between;">
            <a th:href="@{/}" class="logo">Tech<span>Pulse</span></a>

            <nav class="nav-links mobile-hidden" style="display: flex; gap: 20px; margin-left: 50px;">
                <a th:href="@{/}" style="color:var(--fg); font-weight: 600;">Home</a>
                <a href="#">Articles</a>
                <a href="#">Reviews</a>
                <a href="#">AI &amp; ML</a>
            </nav>

            <div class="search-box mobile-hidden" style="position: relative; margin-left: auto; margin-right: 30px;">
                <input type="text" placeholder="Search..." class="input" style="padding-left: 35px; border-radius: 20px; height: 36px; width: 250px; font-size: 14px; border: 1px solid var(--border);">
                <svg style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted-fg);" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>

            <div class="nav-actions mobile-hidden" style="display: flex; align-items: center; gap: 15px;">
                <th:block th:if="${currentUser == null}">
                    <a th:href="@{/login}" class="btn btn-ghost btn-sm">Log in</a>
                    <a th:href="@{/register}" class="btn btn-primary btn-sm">Sign up</a>
                </th:block>

                <div th:if="${currentUser != null}" style="position: relative; display: flex; align-items: center; gap: 15px;">
                    <div class="user-profile-menu" style="position: relative;">
                        <button id="user-menu-button" style="background: none; border: 2px solid transparent; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 0; border-radius: 50%; outline: none; transition: border-color 0.2s;" onmouseover="this.style.borderColor='var(--primary, #10b981)'" onmouseout="this.style.borderColor='transparent'" title="User Menu">
                            <div style="width: 38px; height: 38px; border-radius: 50%; background-color: var(--primary, #10b981); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px;">
                                <span th:text="${#strings.substring(currentUser, 0, 1).toUpperCase()}">U</span>
                            </div>
                        </button>

                        <div id="user-dropdown-menu" style="display: none; position: absolute; right: 0; top: 100%; margin-top: 10px; width: 180px; background-color: white; border: 1px solid var(--border, #e5e7eb); border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); z-index: 50; overflow: hidden;">
                            <div style="padding: 12px 16px; border-bottom: 1px solid var(--border, #e5e7eb); background-color: #f9fafb;">
                                <p style="margin: 0; font-size: 14px; font-weight: 600; color: var(--fg, #111827); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" th:text="${currentUser}">Username</p>
                            </div>
                            <a th:href="@{/profile}" style="display: block; padding: 10px 16px; color: var(--fg, #374151); text-decoration: none; font-size: 14px; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#f3f4f6'" onmouseout="this.style.backgroundColor='transparent'">Hồ sơ</a>
                            <a th:href="@{/author/dashboard}" style="display: block; padding: 10px 16px; color: var(--fg, #374151); text-decoration: none; font-size: 14px; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#f3f4f6'" onmouseout="this.style.backgroundColor='transparent'">Dashboard</a>
                            <div style="height: 1px; background-color: var(--border, #e5e7eb); width: 100%;"></div>
                            <form th:action="@{/logout}" method="post" style="margin: 0;" onsubmit="return confirm('Are you sure you want to log out?');">
                                <button type="submit" style="display: block; width: 100%; text-align: left; padding: 10px 16px; color: var(--destructive, #ef4444); background: transparent; border: none; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#fef2f2'" onmouseout="this.style.backgroundColor='transparent'">Log out</button>
                            </form>
                        </div>
                    </div>
                    
                    <script th:inline="javascript">
                        document.addEventListener('DOMContentLoaded', function() {
                            const button = document.getElementById('user-menu-button');
                            const menu = document.getElementById('user-dropdown-menu');
                            
                            if (button && menu) {
                                button.addEventListener('click', function(e) {
                                    e.stopPropagation();
                                    const isVisible = menu.style.display === 'block';
                                    menu.style.display = isVisible ? 'none' : 'block';
                                });

                                document.addEventListener('click', function(e) {
                                    if (!button.contains(e.target) && !menu.contains(e.target)) {
                                        menu.style.display = 'none';
                                    }
                                });
                            }
                        });
                    </script>
                </div>
            </div>

            <button id="mobile-menu-btn" class="btn btn-ghost btn-icon" style="display:none">☰</button>
        </div>
    </header>
</body>
</html>
