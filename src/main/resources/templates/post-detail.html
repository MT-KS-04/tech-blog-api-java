<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="${post.summary}">
    <title th:text="${post.title + ' | TechPulse'}">Post | TechPulse</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .post-detail-hero {
            position: relative;
            width: 100%;
            min-height: 340px;
            display: flex;
            align-items: flex-end;
            background: linear-gradient(135deg, hsla(160, 45%, 40%, 0.12), var(--muted), var(--secondary));
            overflow: hidden;
        }
        .post-detail-hero img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .post-detail-hero .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, hsla(220,20%,12%,0.7), transparent 60%);
        }
        .post-detail-hero .hero-text {
            position: relative;
            z-index: 1;
            padding: 2.5rem 0;
            color: white;
        }
        .post-detail-hero .hero-text h1 {
            font-size: 2.25rem;
            line-height: 1.2;
            color: white;
        }
        .post-detail-hero .hero-summary {
            margin-top: 1rem;
            font-size: 1.05rem;
            line-height: 1.55;
            color: hsla(0,0%,100%,0.88);
            font-family: var(--font-body);
            max-width: 52rem;
        }
        .post-detail-hero .hero-text .meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
            font-size: 0.875rem;
            color: hsla(0,0%,100%,0.8);
        }
        .post-content-wrap {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 1rem 4rem;
        }
        .post-content-wrap .post-body {
            font-size: 1.0625rem;
            line-height: 1.85;
            color: var(--fg);
        }
        .post-content-wrap .post-body p {
            margin-bottom: 1.25rem;
        }
        .post-content-wrap .post-body h2 {
            margin-top: 2rem;
            margin-bottom: 0.75rem;
        }
        .post-content-wrap .post-body h3 {
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .post-content-wrap .post-body img {
            border-radius: var(--radius);
            margin: 1.5rem 0;
        }
        .post-content-wrap .post-body ul,
        .post-content-wrap .post-body ol {
            padding-left: 1.5rem;
            margin-bottom: 1.25rem;
        }
        .post-content-wrap .post-body blockquote {
            border-left: 3px solid var(--primary);
            padding: 0.75rem 1.25rem;
            margin: 1.5rem 0;
            background: var(--secondary);
            border-radius: 0 var(--radius) var(--radius) 0;
            color: var(--muted-fg);
        }
        .post-content-wrap .post-body pre {
            background: hsl(220, 20%, 12%);
            color: hsl(160, 40%, 70%);
            padding: 1.25rem;
            border-radius: var(--radius);
            overflow-x: auto;
            margin: 1.5rem 0;
            font-size: 0.875rem;
        }
        .post-content-wrap .post-body code {
            background: var(--secondary);
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-size: 0.875em;
        }
        .post-content-wrap .post-body pre code {
            background: none;
            padding: 0;
        }
        .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
        @media(max-width: 767px) {
            .post-detail-hero .hero-text h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main>
        <section class="post-detail-hero">
            <img th:if="${post.thumbnailUrl != null}" th:src="${post.thumbnailUrl}" th:alt="${post.title}">
            <div class="overlay" th:if="${post.thumbnailUrl != null}"></div>
            <div class="container hero-text">
                <div>
                    <span class="badge badge-primary"
                          th:text="${post.category != null ? post.category.name : 'Uncategorized'}">Category</span>
                </div>
                <h1 th:text="${post.title}">Post Title</h1>
                <p class="hero-summary" th:if="${post.summary != null and !#strings.isEmpty(post.summary)}"
                   th:text="${post.summary}">Subtitle</p>
                <div class="meta">
                    <span th:text="${post.author != null ? post.author.username : 'Unknown'}">Author</span>
                    <span>•</span>
                    <span th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy')}">01 Jan 2026</span>
                    <span>•</span>
                    <span th:text="${(post.content != null ? post.content.length() / 1000 : 1) + ' min read'}">5 min read</span>
                    <span>•</span>
                    <span>👁 <span th:text="${post.viewCount}">0</span></span>
                </div>
            </div>
        </section>

        <div class="post-content-wrap">
            <p th:if="${postActionError != null}" class="profile-alert profile-alert-error" th:text="${postActionError}"></p>

            <!-- Tác giả -->
            <div class="post-author-strip" th:with="auth=${post.author}">
                <div class="post-author-avatar" aria-hidden="true"
                     th:text="${auth != null ? #strings.substring(auth.username,0,1).toUpperCase() : '?'}">A</div>
                <div class="post-author-text">
                    <span class="post-author-name" th:text="${auth != null ? auth.username : 'Unknown'}">Author</span>
                    <p class="post-author-bio" th:text="${authorBioDisplay}">Bio</p>
                </div>
            </div>

            <!-- Thanh tương tác: Thích | Bình luận —— Lưu | Chia sẻ -->
            <div class="post-interaction-bar" id="post-interactions">
                <div class="post-interaction-group">
                    <th:block th:if="${currentUser != null}">
                        <form th:action="@{/post/{slug}/like(slug=${post.slug})}" method="post" style="margin:0;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="post-interaction-btn" th:classappend="${postLiked} ? ' is-active' : ''" th:title="${postLiked} ? 'Bỏ thích' : 'Thích'">
                                <svg class="icon-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                                </svg>
                                <span th:text="${likeCount}">0</span>
                            </button>
                        </form>
                    </th:block>
                    <th:block th:if="${currentUser == null}">
                        <a th:href="@{/login}" class="post-interaction-btn" title="Đăng nhập để thích">
                            <svg class="icon-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                            </svg>
                            <span th:text="${likeCount}">0</span>
                        </a>
                    </th:block>

                    <a href="#comments" class="post-interaction-btn" title="Bình luận">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        <span th:text="${commentCount}">0</span>
                    </a>
                </div>

                <div class="post-interaction-group">
                    <th:block th:if="${currentUser != null}">
                        <form th:action="@{/post/{slug}/bookmark(slug=${post.slug})}" method="post" style="margin:0;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="post-interaction-btn" th:classappend="${postBookmarked} ? ' is-active' : ''"
                                    th:title="${postBookmarked} ? 'Bỏ lưu' : 'Lưu bài'">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-bookmark" aria-hidden="true">
                                    <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
                                </svg>
                                <span th:text="${postBookmarked} ? 'Đã lưu' : 'Lưu'">Lưu</span>
                            </button>
                        </form>
                    </th:block>
                    <th:block th:if="${currentUser == null}">
                        <a th:href="@{/login}" class="post-interaction-btn" title="Đăng nhập để lưu">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
                            </svg>
                            <span>Lưu</span>
                        </a>
                    </th:block>

                    <button type="button" class="post-interaction-btn" id="post-share-btn" title="Chia sẻ">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="18" cy="5" r="3"/>
                            <circle cx="6" cy="12" r="3"/>
                            <circle cx="18" cy="19" r="3"/>
                            <line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/>
                            <line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/>
                        </svg>
                        <span>Chia sẻ</span>
                    </button>
                </div>
            </div>

            <div class="post-body" th:utext="${htmlContent}">
                Post content goes here...
            </div>

            <div class="post-tags" th:if="${post.tags != null and not post.tags.isEmpty()}">
                <span class="badge badge-secondary" th:each="tag : ${post.tags}" th:text="${tag.name}">Tag</span>
            </div>

            <!-- Bình luận -->
            <section class="comments-section" id="comments">
                <h2 class="comments-section-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <span>Bình luận (<span th:text="${commentCount}">0</span>)</span>
                </h2>

                <div class="comment-form-box" th:if="${currentUser != null}">
                    <form th:action="@{/post/{slug}/comment(slug=${post.slug})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <textarea name="content" placeholder="Viết bình luận của bạn..." required maxlength="8000"></textarea>
                        <div class="comment-form-actions">
                            <button type="submit" class="btn btn-primary btn-sm">Đăng bình luận</button>
                        </div>
                    </form>
                </div>
                <p th:if="${currentUser == null}" class="text-muted text-sm" style="margin-bottom:1.5rem;">
                    <a th:href="@{/login}">Đăng nhập</a> để tham gia bình luận.
                </p>

                <div th:if="${comments == null or comments.isEmpty()}" class="text-muted text-sm" style="margin-bottom:1rem;">
                    Chưa có bình luận. Hãy là người đầu tiên!
                </div>

                <th:block th:replace="~{fragments/comment-thread :: commentNodes(${comments})}"></th:block>
            </section>

            <div style="margin-top: 2rem;">
                <a th:href="@{/}" class="btn btn-outline">← Quay lại trang chủ</a>
            </div>
        </div>
    </main>

    <div id="share-toast" class="share-toast" role="status" aria-live="polite">Đã sao chép liên kết</div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:inline="javascript">
        (function () {
            var btn = document.getElementById('post-share-btn');
            var toast = document.getElementById('share-toast');
            function showToast() {
                if (!toast) return;
                toast.classList.add('is-visible');
                setTimeout(function () { toast.classList.remove('is-visible'); }, 2200);
            }
            function copyLink(url) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(url).then(showToast);
                }
                return Promise.reject();
            }
            if (btn) {
                btn.addEventListener('click', function () {
                    var url = window.location.href;
                    if (navigator.share) {
                        navigator.share({ title: document.title, url: url }).catch(function () {
                            copyLink(url).catch(function () { prompt('Sao chép liên kết:', url); });
                        });
                    } else {
                        copyLink(url).catch(function () { prompt('Sao chép liên kết:', url); showToast(); });
                    }
                });
            }
        })();
    </script>
</body>

</html>
