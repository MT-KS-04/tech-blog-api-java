<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài đã thích | TechPulse</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div th:replace="~{fragments/profile-shell :: profileHero(activeTab=${activeTab})}"></div>

    <main class="container profile-page">
        <div class="profile-layout">
            <div>
                <h2 class="profile-section-heading">Bài viết đã thích</h2>
                <div th:if="${not #lists.isEmpty(likedPosts)}"
                     th:replace="~{fragments/profile-post-cards :: cards(posts=${likedPosts})}"></div>
                <div th:if="${#lists.isEmpty(likedPosts)}" class="profile-card profile-empty-card">
                    <p class="profile-empty">Chưa có bài viết nào được thích. Hãy khám phá các bài trên trang chủ.</p>
                </div>
            </div>
            <div th:replace="~{fragments/profile-shell :: profileStats}"></div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
