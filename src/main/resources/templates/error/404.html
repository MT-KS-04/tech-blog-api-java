<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang | TechPulse</title>

    <!-- Google Fonts: Playfair Display + Source Sans 3 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary:   { DEFAULT: 'hsl(160,45%,40%)', foreground: '#ffffff', light: 'hsl(160,45%,95%)' },
                        muted:     { DEFAULT: 'hsl(40,10%,93%)',  foreground: 'hsl(220,10%,46%)' },
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'Georgia', 'serif'],
                        body:    ['"Source Sans 3"', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <style>
        body { font-family: 'Source Sans 3', system-ui, sans-serif; background-color: hsl(40,20%,98%); color: hsl(220,20%,12%); }
        h1 { font-family: 'Playfair Display', Georgia, serif; }
        
        .error-card {
            background: white;
            border: 1px solid hsl(40,10%,88%);
            border-radius: 24px;
            box-shadow: 0 20px 50px -12px rgba(0,0,0,0.05);
        }
        
        .btn-home {
            background: hsl(160,45%,40%);
            color: white;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-home:hover {
            background: hsl(160,45%,35%);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full text-center">
        <!-- Logo -->
        <div class="flex justify-center mb-12">
            <div class="flex items-center gap-3">
                <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl text-white font-bold text-lg" style="background: hsl(160,45%,40%);">
                    TP
                </div>
                <span class="font-display text-2xl font-bold" style="color: hsl(220,20%,12%);">TechPulse</span>
            </div>
        </div>

        <div class="error-card p-10 md:p-14">
            <div class="mb-8 relative inline-block">
                <div class="absolute -inset-4 bg-primary/5 rounded-full blur-xl"></div>
                <i data-lucide="compass" class="w-20 h-20 text-primary relative animate-pulse"></i>
            </div>
            
            <h1 class="text-6xl font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-emerald-600 to-teal-500">404</h1>
            <h2 class="text-2xl font-semibold mb-3">Trang không tồn tại</h2>
            <p class="text-muted-foreground mb-10 leading-relaxed">
                Có vẻ như đường dẫn bạn đang truy cập không tồn tại hoặc đã được di chuyển. Đừng lo lắng, hãy quay lại trang chủ nhé!
            </p>

            <a href="/" class="btn-home inline-flex items-center gap-2 px-8 py-3.5 rounded-full font-semibold text-sm">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Về trang chủ
            </a>
        </div>
        
        <p class="mt-12 text-sm text-gray-400">
            &copy; 2024 TechPulse Blog. Tất cả quyền được bảo lưu.
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();
        });
    </script>
</body>
</html>
