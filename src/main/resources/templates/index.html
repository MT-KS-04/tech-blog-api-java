<!DOCTYPE html>
<!-- Đây là dòng BẮT BUỘC để báo trình duyệt và Spring biết file này dùng Thymeleaf -->
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Chủ MVC</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">

    <!-- CÁCH NHẬN SỐ 1: Bắt dữ liệu và cài đè lên đoạn Text bên trong thẻ -->
    <!-- Khi chạy thật, dòng chữ "Đang tải dữ liệu..." sẽ biến mất và bị đè bởi cái biến "message" -->
    <h1 style="color: green;" th:text="${message}">Đang tải dữ liệu...</h1>

    <div style="background-color: #f1f1f1; padding: 15px; border-radius: 8px;">
        <h3>Thông tin hệ thống:</h3>
        <ul>
            <!-- CÁCH NHẬN SỐ 2: Nối chuỗi thông thường -->
            <li><b>Tên hệ thống:</b> <span th:text="${serviceName}"></span></li>
            <li><b>Trạng thái:</b> <span th:text="${status}" style="color: blue;"></span></li>
            <li><b>Phiên bản:</b> <span th:text="${version}"></span></li>
            <li><b>Môi trường:</b> <span th:text="${environment}"></span></li>
            <li><b>Uptime (giây):</b> <span th:text="${uptime}"></span></li>
            <li><b>Thời gian Server:</b> <span th:text="${timestamp}"></span></li>
        </ul>
    </div>

    <!-- CÁCH NHẬN SỐ 3: Đưa dữ liệu vào thuộc tính href của thẻ <a> -->
    <p style="margin-top: 20px;">
        Xem thêm tài liệu API tại: 
        <a th:href="${docs}">Đến trang Docs</a>
    </p>

</body>
</html>
