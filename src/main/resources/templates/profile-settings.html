<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài đặt tài khoản | TechPulse</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div th:replace="~{fragments/profile-shell :: profileHero(activeTab=${activeTab})}"></div>

    <main class="container profile-page">
        <div th:if="${settingsPasswordSuccess}" class="profile-alert profile-alert-success" th:text="${settingsPasswordSuccess}"></div>
        <div th:if="${settingsPasswordError}" class="profile-alert profile-alert-error" th:text="${settingsPasswordError}"></div>
        <div th:if="${settingsNotifySuccess}" class="profile-alert profile-alert-success" th:text="${settingsNotifySuccess}"></div>
        <div th:if="${settingsDeleteError}" class="profile-alert profile-alert-error" th:text="${settingsDeleteError}"></div>

        <div class="profile-layout">
            <div class="profile-card profile-settings-card">
                <h2 class="profile-settings-main-title">Cài đặt tài khoản</h2>

                <section class="profile-settings-section">
                    <h3 class="profile-settings-subtitle">Đổi mật khẩu</h3>
                    <form th:action="@{/profile/settings/password}" th:object="${passwordChangeForm}" method="post" class="profile-settings-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="profile-settings-password-row">
                            <div>
                                <label class="label" for="currentPassword">Mật khẩu hiện tại</label>
                                <input id="currentPassword" type="password" class="input profile-settings-input" th:field="*{currentPassword}" placeholder="Mật khẩu hiện tại" autocomplete="current-password"/>
                                <p th:if="${#fields.hasErrors('currentPassword')}" class="profile-field-error" th:errors="*{currentPassword}"></p>
                            </div>
                            <div>
                                <label class="label" for="newPassword">Mật khẩu mới</label>
                                <input id="newPassword" type="password" class="input profile-settings-input" th:field="*{newPassword}" placeholder="Mật khẩu mới" autocomplete="new-password"/>
                                <p th:if="${#fields.hasErrors('newPassword')}" class="profile-field-error" th:errors="*{newPassword}"></p>
                            </div>
                        </div>
                        <div class="profile-settings-password-row profile-settings-password-row-single">
                            <div>
                                <label class="label" for="confirmPassword">Xác nhận mật khẩu mới</label>
                                <input id="confirmPassword" type="password" class="input profile-settings-input" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password"/>
                                <p th:if="${#fields.hasErrors('confirmPassword')}" class="profile-field-error" th:errors="*{confirmPassword}"></p>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary profile-settings-submit">Cập nhật mật khẩu</button>
                    </form>
                </section>

                <section class="profile-settings-section">
                    <h3 class="profile-settings-subtitle profile-settings-subtitle-with-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                        Thông báo
                    </h3>
                    <form th:action="@{/profile/settings/notifications}" method="post" class="profile-notify-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <label class="profile-check-row">
                            <input type="checkbox" name="notifyCommentReply" value="true" th:checked="${profileUser.notifyCommentReply}"/>
                            <span>Nhận email khi có phản hồi bình luận</span>
                        </label>
                        <label class="profile-check-row">
                            <input type="checkbox" name="notifyWeeklyNewsletter" value="true" th:checked="${profileUser.notifyWeeklyNewsletter}"/>
                            <span>Nhận bản tin hàng tuần</span>
                        </label>
                        <label class="profile-check-row">
                            <input type="checkbox" name="notifyAuthorPosts" value="true" th:checked="${profileUser.notifyAuthorPosts}"/>
                            <span>Nhận thông báo bài viết mới từ tác giả theo dõi</span>
                        </label>
                        <button type="submit" class="btn btn-outline profile-settings-submit profile-settings-submit-muted">Lưu tùy chọn thông báo</button>
                    </form>
                </section>

                <section class="profile-settings-section profile-settings-danger">
                    <h3 class="profile-settings-subtitle">Vùng nguy hiểm</h3>
                    <form th:action="@{/profile/settings/account/delete}" method="post"
                          onsubmit="return confirm('Xóa vĩnh viễn tài khoản? Bạn sẽ bị đăng xuất và không thể đăng nhập lại.');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn profile-btn-delete-account">Xóa tài khoản</button>
                        <p class="profile-danger-hint">Hành động này không thể hoàn tác.</p>
                    </form>
                </section>
            </div>
            <div th:replace="~{fragments/profile-shell :: profileStats}"></div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
