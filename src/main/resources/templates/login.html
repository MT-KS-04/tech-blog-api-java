<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log in - Tech Blog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main>
        <div class="mx-auto flex max-w-md flex-col px-4 py-16 sm:px-6">
            <h1 class="text-3xl font-bold text-foreground">Welcome back</h1>
            <p class="mt-2 text-sm text-muted-foreground">Sign in to your TechPulse account.</p>

            <div th:if="${param.error}" style="color: var(--destructive); margin-top: 1rem; font-size: 0.875rem;">
                Invalid username or password!
            </div>
            <div th:if="${param.success}" style="color: var(--primary); margin-top: 1rem; font-size: 0.875rem;">
                Registration successful! Please sign in.
            </div>

            <form class="mt-8 space-y-4" th:action="@{/login}" method="post">
                <div class="space-y-2">
                    <label for="username" class="label">Username</label>
                    <input id="username" name="username" type="text" placeholder="Enter your username" class="input" required autofocus />
                </div>
                <div class="space-y-2">
                    <label for="password" class="label">Password</label>
                    <input id="password" name="password" type="password" placeholder="••••••••" class="input" required />
                </div>
                <button type="submit" class="btn btn-primary w-full btn-lg">Sign in</button>
            </form>

            <p class="mt-6 text-center text-sm text-muted-foreground">
                Don't have an account? <a th:href="@{/register}" class="font-medium text-primary hover:underline" style="text-decoration: underline;">Sign up</a>
            </p>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
