<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin_layout :: adminHead(${category.id == null ? 'Thêm mới danh mục' : 'Cập nhật danh mục'})}">
    <meta charset="UTF-8">
    <title>Form Danh mục | TechPulse Admin</title>
</head>
<body th:replace="~{fragments/admin_layout :: adminLayout(${category.id == null ? 'Thêm mới danh mục' : 'Cập nhật danh mục'}, ~{::#main-content})}">

<div id="main-content">
    <style>
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; color: hsl(220,20%,12%); margin-bottom: 8px; }
        .form-control { width: 100%; max-width: 600px; padding: 10px 14px; border: 1px solid hsl(40,10%,88%); border-radius: 8px; font-size: 14px; background: white; outline: none; transition: border-color 0.15s; }
        .form-control:focus { border-color: hsl(160,45%,40%); box-shadow: 0 0 0 3px hsla(160,45%,40%, 0.1); }
        .form-control.is-invalid { border-color: hsl(0,72%,51%); }
        .invalid-feedback { font-size: 13px; color: hsl(0,72%,51%); margin-top: 6px; display: block; }
        .help-text { font-size: 12px; color: hsl(220,10%,46%); margin-top: 6px; display: block; }

        .btn-action { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; text-decoration: none; }
        .btn-primary { background: hsl(160,45%,40%); color: white; }
        .btn-primary:hover { background: hsl(160,45%,35%); }
        .btn-secondary { background: hsl(40,10%,93%); color: hsl(220,20%,12%); }
        .btn-secondary:hover { background: hsl(40,10%,88%); }
    </style>

    <!-- Page Header -->
    <div style="margin-bottom: 24px;">
        <h1 style="font-size: 24px; font-weight: 700; margin: 0;" th:text="${category.id == null ? 'Thêm danh mục mới' : 'Cập nhật danh mục'}"></h1>
        <p style="font-size: 14px; color: hsl(220,10%,46%); margin: 4px 0 0 0;">Điền thông tin chi tiết cho danh mục</p>
    </div>

    <!-- Card Form -->
    <div class="card" style="padding: 24px; max-width: 800px;">
        <form th:action="@{/admin/categories/save}" th:object="${category}" method="post">
            
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label class="form-label" for="name">Tên danh mục <span style="color: hsl(0,72%,51%);">*</span></label>
                <input type="text" id="name" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="Ví dụ: AI & Machine Learning">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="slug">Slug (Đường dẫn tĩnh)</label>
                <input type="text" id="slug" th:field="*{slug}" class="form-control" th:classappend="${#fields.hasErrors('slug')} ? 'is-invalid' : ''" placeholder="Ví dụ: ai-machine-learning">
                <span class="help-text">Nếu để trống, hệ thống sẽ tự động tạo chuỗi slug chuẩn từ Tên danh mục.</span>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">Mô tả</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="4" placeholder="Mô tả ngắn gọn về chủ đề này..."></textarea>
            </div>

            <div style="margin-top: 30px; display: flex; gap: 12px; border-top: 1px solid hsl(40,10%,88%); padding-top: 20px;">
                <button type="submit" class="btn-action btn-primary">
                    <i data-lucide="save" style="width:16px; height:16px;"></i> Lưu danh mục
                </button>
                <a th:href="@{/admin/categories}" class="btn-action btn-secondary">
                    Hủy bỏ
                </a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
