<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin_layout :: adminHead('Quản lý người dùng')}">
    <meta charset="UTF-8">
    <title>Quản lý người dùng | TechPulse Admin</title>
</head>
<body th:replace="~{fragments/admin_layout :: adminLayout('Quản lý người dùng', ~{::#main-content})}">

        <div id="main-content">
            <style>
                /* Style đặc thù cho Quản lý người dùng */
                .search-wrapper { position: relative; }
                .search-wrapper svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: hsl(220,10%,46%); pointer-events: none; }
                .search-input { width: 100%; padding: 10px 12px 10px 38px; border: 1px solid hsl(40,10%,88%); border-radius: 8px; font-size: 14px; background: white; outline: none; transition: border-color 0.15s; }
                .search-input:focus { border-color: hsl(160,45%,40%); box-shadow: 0 0 0 3px hsla(160,45%,40%, 0.1); }

                table { width: 100%; border-collapse: collapse; }
                th { padding: 12px 16px; text-align: left; font-size: 13px; font-weight: 600; color: hsl(220,10%,46%); border-bottom: 1px solid hsl(40,10%,88%); }
                td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid hsl(40,10%,88%); vertical-align: middle; }
                tbody tr:hover { background: hsl(40,20%,99%); }

                .avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid hsl(40,10%,88%); }

                .role-select { padding: 5px 8px; border: 1px solid hsl(40,10%,88%); border-radius: 6px; font-size: 13px; background: white; outline: none; }
                .role-select:focus { border-color: hsl(160,45%,40%); }

                .btn-action { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
                .btn-update  { background: hsl(160,45%,95%); color: hsl(160,45%,40%); }
                .btn-update:hover { background: hsl(160,45%,88%); }
                .btn-lock    { background: hsl(40,90%,94%); color: hsl(35,85%,40%); }
                .btn-unlock  { background: hsl(220,70%,96%); color: hsl(220,70%,42%); }
                .btn-delete  { background: hsl(0,72%,95%); color: hsl(0,72%,51%); }

                .pagination { display: flex; align-items: center; gap: 6px; margin-top: 20px; }
                .page-btn { padding: 6px 12px; border-radius: 7px; border: 1px solid hsl(40,10%,88%); font-size: 13px; font-weight: 500; text-decoration: none; color: hsl(220,20%,12%); }
                .page-btn.current { background: hsl(160,45%,40%); color: white; border-color: hsl(160,45%,40%); }
                .page-btn.disabled { opacity: 0.4; pointer-events: none; }
            </style>

            <!-- Page Header -->
            <div style="margin-bottom: 24px;">
                <h1 style="font-size: 24px; font-weight: 700; margin: 0;">Quản lý người dùng</h1>
                <p style="font-size: 14px; color: hsl(220,10%,46%); margin: 4px 0 0 0;" th:text="${totalItems + ' người dùng trên nền tảng'}"></p>
            </div>

            <!-- Alerts -->
            <div th:if="${success}" class="alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert-error" th:text="${error}"></div>

            <!-- Card -->
            <div class="card">
                <!-- Search -->
                <div style="padding: 20px; border-bottom: 1px solid hsl(40,10%,88%);">
                    <form th:action="@{/admin/users}" method="get" style="display: flex; gap: 10px; align-items: center;">
                        <div class="search-wrapper" style="flex: 1;">
                            <i data-lucide="search"></i>
                            <input type="text" name="keyword" class="search-input" th:value="${keyword}" placeholder="Tìm kiếm theo tên hoặc email...">
                        </div>
                        <button type="submit" class="btn-action btn-update" style="padding: 10px 20px;">Tìm kiếm</button>
                    </form>
                </div>

                <!-- Table -->
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 50px;">#</th>
                                <th>Người dùng</th>
                                <th>Vai trò</th>
                                <th>Trạng thái</th>
                                <th>Ngày tạo</th>
                                <th style="text-align: right;">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user, status : ${users}">
                                <!-- Số thứ tự (STT) -->
                                <td style="color: hsl(220,10%,46%); font-weight: 500;" 
                                    th:text="${currentPage * pageSize + status.count}">1</td>
                                
                                <td>
                                    <div style="display: flex; align-items: center; gap: 12px;">
                                        <img th:src="@{'https://ui-avatars.com/api/?name=' + ${user.username} + '&background=4ade80&color=fff'}" class="avatar">
                                        <div>
                                            <p style="font-weight: 600; margin:0;" th:text="${user.username}"></p>
                                            <p style="color: hsl(220,10%,46%); font-size:12px; margin:0;" th:text="${user.email}"></p>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span th:if="${user.role.name() == 'ADMIN'}"   class="badge-admin badge">Admin</span>
                                    <span th:if="${user.role.name() == 'EDITOR'}"  class="badge-editor badge">Editor</span>
                                    <span th:if="${user.role.name() == 'USER'}"    class="badge-user badge">User</span>
                                </td>
                                <td>
                                    <span th:if="${user.isActive}"  class="badge-active badge">Hoạt động</span>
                                    <span th:if="${!user.isActive}" class="badge-inactive badge">Bị khóa</span>
                                </td>
                                <td style="color: hsl(220,10%,46%); font-size:13px;" th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy')}"></td>
                                <td>
                                    <div style="display: flex; align-items: center; gap: 8px; justify-content: flex-end;">
                                        <!-- Update Role -->
                                        <form th:action="@{/admin/users/update-role}" method="post" style="display: flex; gap: 6px;">
                                            <input type="hidden" name="userId" th:value="${user.id}">
                                            <select name="role" class="role-select">
                                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == user.role}"></option>
                                            </select>
                                            <button type="submit" class="btn-action btn-update">
                                                <i data-lucide="check" style="width:14px; height:14px;"></i>
                                                <span>Cập nhật</span>
                                            </button>
                                        </form>

                                        <!-- Lock/Unlock -->
                                        <form th:action="@{/admin/users/toggle-status/{id}(id=${user.id})}" method="post">
                                            <button type="submit" th:class="${user.isActive ? 'btn-lock btn-action' : 'btn-unlock btn-action'}" th:title="${user.isActive ? 'Khóa' : 'Mở'}">
                                                <i th:attr="data-lucide=${user.isActive ? 'ban' : 'unlock'}" style="width:14px; height:14px;"></i>
                                                <span th:text="${user.isActive ? 'Khóa' : 'Mở khóa'}"></span>
                                            </button>
                                        </form>

                                        <!-- Delete -->
                                        <form th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post" onsubmit="return confirm('Xóa vĩnh viễn người dùng này?')">
                                            <button type="submit" class="btn-delete btn-action">
                                                <i data-lucide="trash-2" style="width:14px; height:14px;"></i>
                                                <span>Xóa</span>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div style="padding: 20px; border-top: 1px solid hsl(40,10%,88%);" th:if="${totalPages > 1}">
                    <div class="pagination">
                        <a class="page-btn" th:classappend="${currentPage == 0 ? ' disabled' : ''}" th:href="@{/admin/users(page=${currentPage - 1}, keyword=${keyword})}">Trước</a>
                        <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                            <a th:href="@{/admin/users(page=${i}, keyword=${keyword})}" class="page-btn" th:classappend="${i == currentPage ? ' current' : ''}" th:text="${i + 1}"></a>
                        </th:block>
                        <a class="page-btn" th:classappend="${currentPage >= totalPages - 1 ? ' disabled' : ''}" th:href="@{/admin/users(page=${currentPage + 1}, keyword=${keyword})}">Sau</a>
                    </div>
                </div>
            </div>
        </div>

</body>
</html>
