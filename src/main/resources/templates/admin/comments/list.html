<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin_layout :: adminHead('Quản lý bình luận')}">
    <meta charset="UTF-8">
    <title>Quản lý bình luận | TechPulse Admin</title>
</head>
<body th:replace="~{fragments/admin_layout :: adminLayout('Quản lý bình luận', ~{::#main-content})}">

<div id="main-content">
    <style>
        .search-wrapper { position: relative; }
        .search-wrapper svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: hsl(220,10%,46%); pointer-events: none; }
        .search-input { width: 100%; padding: 10px 12px 10px 38px; border: 1px solid hsl(40,10%,88%); border-radius: 8px; font-size: 14px; background: white; outline: none; transition: border-color 0.15s; }
        .search-input:focus { border-color: hsl(160,45%,40%); box-shadow: 0 0 0 3px hsla(160,45%,40%, 0.1); }

        table { width: 100%; border-collapse: collapse; overflow: hidden; }
        th { padding: 12px 16px; text-align: left; font-size: 13px; font-weight: 600; color: hsl(220,10%,46%); border-bottom: 1px solid hsl(40,10%,88%); }
        td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid hsl(40,10%,88%); vertical-align: top; max-width: 300px; }
        tbody tr:hover { background: hsl(40,20%,99%); }

        .btn-action { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; text-decoration: none; }
        .btn-primary { background: hsl(160,45%,40%); color: white; }
        .btn-primary:hover { background: hsl(160,45%,35%); }
        .btn-delete  { background: hsl(0,72%,95%); color: hsl(0,72%,51%); padding: 6px 12px;}
        .btn-delete:hover { background: hsl(0,72%,90%); }
        
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; background: hsl(40,15%,90%);  color: hsl(220,10%,40%); }
        .text-ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        
        /* For content clamping */
        .content-clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; color: hsl(220,20%,12%); font-size: 13px; line-height: 1.5; background: hsl(40,20%,98%); padding: 10px; border-radius: 6px; border: 1px solid hsl(40,10%,90%); margin-top: 4px;}
        
        .meta-info { font-size: 12px; color: hsl(220,10%,46%); display: flex; align-items: center; gap: 4px; margin-top: 6px;}
    </style>

    <!-- Page Header -->
    <div style="margin-bottom: 24px;">
        <h1 style="font-size: 24px; font-weight: 700; margin: 0;">Quản lý bình luận</h1>
        <p style="font-size: 14px; color: hsl(220,10%,46%); margin: 4px 0 0 0;" th:text="${comments.size() + ' bình luận trên hệ thống'}"></p>
    </div>

    <!-- Alerts -->
    <div th:if="${success}" class="alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <!-- Card -->
    <div class="card">
        <!-- Search -->
        <div style="padding: 20px; border-bottom: 1px solid hsl(40,10%,88%);">
            <form th:action="@{/admin/comments}" method="get" style="display: flex; gap: 10px; align-items: center;">
                <div class="search-wrapper" style="width: 350px;">
                    <i data-lucide="search"></i>
                    <input type="text" name="keyword" class="search-input" th:value="${keyword}" placeholder="Tìm kiếm nội dung bình luận...">
                </div>
                <button type="submit" class="btn-action btn-primary" style="padding: 10px 20px;">Tìm kiếm</button>
            </form>
        </div>

        <!-- Table -->
        <div style="overflow-x: auto;">
            <table>
                <thead>
                <tr>
                    <th style="width: 50px;">ID</th>
                    <th style="width: 200px;">Người dùng</th>
                    <th>Nội dung bình luận</th>
                    <th style="width: 250px;">Bài viết</th>
                    <th style="text-align: right; width: 100px;">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${comments.empty}">
                    <td colspan="5" style="text-align: center; padding: 30px; color: hsl(220,10%,46%);">Không tìm thấy bình luận nào.</td>
                </tr>
                <tr th:each="c : ${comments}">
                    <td style="color: hsl(220,10%,46%); font-weight: 500;" th:text="${c.id}"></td>
                    <td>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div style="width: 32px; height: 32px; border-radius: 50%; background: hsl(160,45%,40%); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px;" th:text="${#strings.substring(c.user.username, 0, 1).toUpperCase()}"></div>
                            <div>
                                <div style="font-weight: 600; color: hsl(220,20%,12%);" th:text="${c.user.username}"></div>
                                <div style="font-size: 12px; color: hsl(220,10%,46%);" th:text="${c.user.email}"></div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <div th:if="${c.parent != null}" style="font-size: 11px; font-weight: 600; color: hsl(160,45%,40%); margin-bottom: 4px; display: inline-flex; align-items: center; gap: 4px; background: hsl(160,45%,95%); padding: 2px 8px; border-radius: 4px;">
                            <i data-lucide="corner-down-right" style="width: 12px; height: 12px;"></i>
                            Trả lời bình luận #<span th:text="${c.parent.id}"></span>
                        </div>
                        <div class="content-clamp" th:text="${c.content}"></div>
                        <div class="meta-info">
                            <i data-lucide="clock" style="width: 12px; height: 12px;"></i>
                            <span th:text="${#temporals.format(c.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                        </div>
                    </td>
                    <td>
                        <span class="text-ellipsis badge" style="max-width: 200px;" th:text="${c.post.title}" th:title="${c.post.title}"></span>
                    </td>
                    <td>
                        <div style="display: flex; justify-content: flex-end;">
                            <form th:action="@{/admin/comments/delete/{id}(id=${c.id})}" method="post" onsubmit="return confirm('Hành động này sẽ XÓA bình luận này và TẤT CẢ các câu trả lời (reply) bên dưới nó. Bạn có chắc chắn không?')">
                                <button type="submit" class="btn-delete btn-action">
                                    <i data-lucide="trash-2" style="width:14px; height:14px;"></i> Xóa
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
