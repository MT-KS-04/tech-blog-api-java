<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TEST BÀI VIẾT - TechPulse</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .DRAFT { background: #eee; }
        .PUBLISHED { background: #dcfce7; color: #166534; }
        .ARCHIVED { background: #fee2e2; color: #991b1b; }
        .alert { padding: 10px; border-radius: 4px; margin-bottom: 10px; }
        .success { background: #dcfce7; color: #166534; border: 1px solid #166534; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #991b1b; }
        .filters { display: flex; gap: 10px; margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 8px; }
        .btn { padding: 6px 12px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: white; }
        .btn-delete { color: white; background: #ef4444; border: none; }
    </style>
</head>
<body>

    <h1>GIEO DIỆN KIỂM THỬ QUẢN LÝ BÀI VIẾT (PHASE 1)</h1>
    <p><a href="/admin">&larr; Quay lại Dashboard</a></p>

    <!-- Thông báo -->
    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <!-- Bộ lọc tìm kiếm -->
    <div class="filters">
        <form th:action="@{/admin/posts}" method="get" style="display: flex; gap: 10px; align-items: center; width: 100%;">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm theo tiêu đề..." style="flex: 1; padding: 6px;">
            
            <select name="categoryId" style="padding: 6px;">
                <option value="">-- Tất cả danh mục --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == selectedCategoryId}"></option>
            </select>

            <select name="status" style="padding: 6px;">
                <option value="">-- Tất cả trạng thái --</option>
                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${st == selectedStatus}"></option>
            </select>

            <button type="submit" class="btn">Lọc bài viết</button>
            <a th:href="@{/admin/posts}" class="btn" style="text-decoration: none; color: black;">Reset</a>
        </form>
    </div>

    <!-- Bảng danh sách -->
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Tiêu đề</th>
                <th>Tác giả</th>
                <th>Danh mục</th>
                <th>Trạng thái</th>
                <th>Ngày tạo</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(posts)}">
                <td colspan="7" style="text-align: center;">Không có bài viết nào phù hợp.</td>
            </tr>
            <tr th:each="post, stat : ${posts}">
                <td th:text="${stat.count + (currentPage * 10)}"></td>
                <td th:text="${post.title}"></td>
                <td th:text="${post.author != null ? post.author.username : 'Ẩn danh'}"></td>
                <td th:text="${post.category != null ? post.category.name : 'Chưa phân loại'}"></td>
                <td>
                    <span th:class="'badge ' + ${post.status}" th:text="${post.status}">DRAFT</span>
                </td>
                <td th:text="${#temporals.format(post.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <!-- Đổi trạng thái -->
                    <form th:action="@{/admin/posts/update-status}" method="post" style="display: inline;">
                        <input type="hidden" name="postId" th:value="${post.id}">
                        <select name="status" onchange="this.form.submit()" style="padding: 4px;">
                            <option th:each="st : ${statuses}" th:value="${st}" th:text="${'Chuyển ' + st}" th:selected="${st == post.status}"></option>
                        </select>
                    </form>

                    <!-- Xóa vĩnh viễn -->
                    <form th:action="@{/admin/posts/delete/{id}(id=${post.id})}" method="post" 
                          style="display: inline;" onsubmit="return confirm('Bạn có chắc chắn muốn xóa vĩnh viễn bài này? Thao tác này không thể hoàn tác!')">
                        <button type="submit" class="btn btn-delete">Xóa</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Phân trang đơn giản -->
    <div style="margin-top: 20px;" th:if="${postPage.totalPages > 1}">
        <span>Trang: </span>
        <th:block th:each="i : ${#numbers.sequence(0, postPage.totalPages - 1)}">
            <a th:href="@{/admin/posts(page=${i}, keyword=${keyword}, categoryId=${selectedCategoryId}, status=${selectedStatus})}" 
               th:text="${i + 1}" 
               th:style="${i == currentPage ? 'font-weight: bold; color: red;' : ''}"></a>
        </th:block>
    </div>

</body>
</html>
