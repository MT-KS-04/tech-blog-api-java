spring:
  application:
    name: tech-blog-api
  datasource:
    url: jdbc:mysql://localhost:3306/tech_blog_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  web:
    resources:
      static-locations: classpath:/static/,file:./
server:
  port: 8888
  
app:
  environment: development
  log-level: info